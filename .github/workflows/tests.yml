name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so new advisories against our dependency range surface even with no commits.
    - cron: '0 6 * * 1'

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Guzzle ${{ matrix.guzzle }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        guzzle: ['^7.15.2', '^8.0.1']
        deps: ['highest']
        include:
          - php: '8.2'
            guzzle: '^7.15.2'
            deps: 'lowest'
          - php: '8.2'
            guzzle: '^8.0.1'
            deps: 'lowest'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Guzzle major
        run: composer require --no-update --no-interaction "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --prefer-dist
          fi

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci
